name: CI

# Runs on pull requests, and is called by pages.yml before it deploys, so a
# push to main tests and ships in one run rather than racing two workflows
# that know nothing about each other.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The same image .devcontainer/Containerfile builds on, so the browsers and
    # the system libraries behind them are identical here and on a laptop. It
    # is also why there is no `playwright install --with-deps` step: the
    # browsers are already in the image.
    #
    # The tag must match @playwright/test in package.json; `just lint-versions`
    # fails if they drift. Chromium crashes on the 64MB of /dev/shm a container
    # gets by default.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --shm-size=1g

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      # Every tool comes from mise.toml, so CI and a developer's machine run
      # identical versions of node, python, just and the linters.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true

      - run: npm ci

      # The one command. If CI needs to do something, it gets a just recipe
      # first, so that anything CI can do a developer can reproduce.
      - run: just ci

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
